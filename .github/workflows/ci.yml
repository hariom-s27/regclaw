name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r mcp/requirements_mcp.txt "pytest==9.1.1" "hypothesis==6.169.1" "numpy==2.4.6" "scikit-learn==1.9.1" "anthropic==1.14.0" "PyMuPDF==1.28.2" "PyYAML==6.0.3" "jsonschema==4.26.0" "openai==2.54.0" "httpx==0.28.1" "psycopg[binary]==3.3.6" "neo4j==6.4.1" "python-dotenv==1.2.4" "pytest-asyncio==1.4.0"
      - name: Run stub tests
        run: python tasks.py test
