name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r mcp/requirements_mcp.txt pytest hypothesis 'numpy<2.6' 'scikit-learn>=1.9' 'anthropic>=1.0' 'openai>=1.70' 'httpx>=0.27' 'psycopg[binary]>=3.1' 'neo4j>=5.20,<7' 'PyMuPDF>=1.24' 'PyYAML>=6.0' 'jsonschema>=4'
      - name: Run stub tests
        run: python tasks.py test
