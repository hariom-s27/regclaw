# Part II pricing table (USD per 1M tokens).
# Source: platform.claude.com pricing + prompt-caching docs, checked 2026-11-26
currency: USD
per_tokens: 1000000
cap_usd: 60.0

models:
  claude-sonnet-5-5:
    provider: anthropic
    bill_against_cap: true
    input_per_1m: 2.00
    output_per_1m: 10.00
    cache_read_per_1m: 0.10
    cache_write_5m_per_1m: 2.50

  claude-haiku-5-5:
    provider: anthropic
    bill_against_cap: true
    # Tier is set by prompt_tokens = input + cache_read + cache_write
    # (for reservation, tier uses input_estimate).
    prompt_tiers:
      - max_prompt_tokens: 100000
        input_per_1m: 0.10
        output_per_1m: 0.50
        cache_read_per_1m: 0.01
        cache_write_5m_per_1m: 0.125
      - max_prompt_tokens: null
        input_per_1m: 0.50
        output_per_1m: 2.50
        cache_read_per_1m: 0.05
        cache_write_5m_per_1m: 0.625

  gpt-4.1-mini:
    provider: azure_openai
    bill_against_cap: false

  gpt-5-mini:
    provider: azure_openai
    bill_against_cap: false

  text-embedding-3-small:
    provider: azure_openai
    bill_against_cap: false
