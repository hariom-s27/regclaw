    jurisdiction: null
    expected_sources: [fda-*]
    description: "Biocompatibility tests or endpoints that apply to implanted (e.g. orthopaedic/knee) devices."
    narrative:
      grade3: "Tests or endpoints for implant devices with long-term tissue/bone contact."
      grade2: "Implant-specific biocompatibility points (implantation effects, metallic implant materials)."
      grade1_traps: "General biocompatibility tests not tied to implants."

