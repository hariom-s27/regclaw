# retrieval_eval/queries.yaml — S8 query topics v1 — FROZEN 2026-10-18 (approved by Shyam)
# Written blind (no BM25/pool/system output/clause titles seen). Query texts R1–R3 = report wording, verbatim.
# Do not edit. Any change = a new version (v1.1) with a logged reason; never change topics from results.
version: "1.0"
frozen: "2026-10-18"
status: FROZEN

common_rules:
  grades: "3 = directly answers / states the requirement; 2 = relevant (partial answer or necessary condition); 1 = same topic but does not answer; 0 = unrelated. Binary relevant = grade >= 2."
  judge_text_not_graph: "Mandatory/recommended is judged from the clause's own wording, never from the graph's obligation label (regex weak labels)."
  jurisdiction: "If a query names a jurisdiction (Europe, India, US-cleared), a clause from another jurisdiction on the same topic gets at most grade 1. IMDRF counts as another jurisdiction for queries that name Europe, India or the US."
  swap: "After pooling, a query whose pool has no grade-3 clause (judged by the human relevance labels only, never by system scores) is swapped, unless it is a deliberate negative (Q7, Q12). Every swap is logged with its reason."
  rephrase: "Variant b (ISO-style rephrase) uses formal regulatory vocabulary but must not contain the answer. Variant c (HyDE) is LLM-generated later with a frozen prompt."
  obligation_dependency: "Record per query whether its generated stage-1 Cypher filters on obligation. If S5b changes the graph's obligation labels, re-score those queries from the cached Cypher."

queries:
  - qid: R1
    query: "mandatory requirements for biological evaluation"
    rephrase_b: "requirements that shall be met for the biological evaluation of medical devices within a risk management process"
    origin: report
    type: mandatory
    jurisdiction: null
    expected_sources: [fda-*, eu-mdr, in-ep, imdrf-n47]
    description: "Duties (not recommendations) to carry out or document the biological evaluation of a medical device."
    narrative:
      grade3: "A clause that imposes a duty to carry out or document the biological evaluation of a device."
      grade2: "A duty on one part of the evaluation (an endpoint must be addressed; a report must contain X)."
      grade1_traps: "Should-only recommendations about biological evaluation; descriptions of the process."
    notes: "Likely depends on the obligation filter in stage 1."

