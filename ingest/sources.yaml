fda-iso10993-1:
  enabled: true
  mode: fda
  levels:
  - name: attachment
    pattern: ^Attachment\s+(?P<number>[A-Z])(?:\s*[:–—-]?\s+(?P<title>.*))?$
    require_bold: true
    number_format: Attachment {number}
    depth: 1
  - name: appendix
    pattern: ^Appendix\s+(?P<number>[A-Z])(?:\s*[:–—-]?\s+(?P<title>.*))?$
    require_bold: true
    number_format: Appendix {number}
    depth: 1
  - name: roman
    pattern: ^(?P<number>[IVX]+)\.(?:\s+(?P<title>.*))?$
    require_bold: true
    number_format: '{number}'
    depth: 1
  - name: letter
    pattern: ^(?P<number>[A-Z])\.(?:\s+(?P<title>.*))?$
    require_bold: true
    number_format: '{parent}.{number}'
    depth: 2
  - name: digit
    pattern: ^\(?(?P<number>\d+)[.)](?:\s+(?P<title>.*))?$
    require_bold: true
    number_format: '{parent}.{number}'
    depth: 3
  - name: small_letter
    pattern: ^(?P<number>[a-z])\.(?:\s+(?P<title>.*))?$
    require_bold: true
    number_format: '{parent}.{number}'
    depth: 4
  max_depth: 4
  body_start_marker: null
  body_stop_marker: null
  skip_sections:
  - ^(Preface|Public Comment|Additional Copies|Paperwork Reduction Act)\b
  strip_lines:
  - ^Contains Nonbinding Recommendations
  - ^Draft\s*[–—-]?\s*Not for Implementation
  tables: clause
  expected_clauses:
  - 120
  - 250
