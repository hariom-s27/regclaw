eu-mdr:
  enabled: true
  mode: eu
  levels:
  - name: group
    pattern: ^(?P<label>CHAPTER|PART)\s+(?P<number>[IVX]+|[A-Z])\s*$
    require_bold: false
    number_format: '{annex}.{number} (S3-9)'
  - name: article
    pattern: ^Article\s+(?P<number>\d+)\s*$
    require_bold: false
    number_format: Art {number}
    depth: 1
  - name: annex
    pattern: ^ANNEX\s+(?P<number>[IVX]+)\s*$
    require_bold: false
    number_format: Annex {number}
    depth: 1
  - name: paragraph
    pattern: ^\((?P<number>\d+)\)\s*(?P<title>.*)$
    require_bold: false
    number_format: '{parent}({number})'
    depth: 2
  - name: decimal
    pattern: ^(?P<number>\d+(?:\.\d+)*)(?:\.\s*|\s+|$)(?P<title>.*)$
    require_bold: false
    number_format: Art N(n) / Annex R.n
    depth: 1
  - name: point
    pattern: ^\((?P<number>[a-z])\)\s*(?P<title>.*)$
    require_bold: false
    number_format: '{parent}({number})'
    depth: 1
  - name: roman_point
    pattern: ^\((?P<number>[ivxlcdm]+)\)\s*(?P<title>.*)$
    require_bold: false
    number_format: '{letter}({number}) (merged below Article depth cap)'
    depth: 4
  max_depth: 5
  article_max_depth: 3
  body_start_marker: null
  body_stop_marker: null
  skip_sections:
  - ^(Preface|Public Comment|Additional Copies|Paperwork Reduction Act)\b
  strip_lines:
  - ^L 117/\d+
  - ^Official Journal of the European Union$
  - ^5\.5\.2017
  - ^EN$
  tables: 'off'
  expected_clauses:
  - 250
  - 450
