in-mdr:
  enabled: true
  mode: india
  amendment_notes: true
  levels:
  - name: form
    pattern: ^\[?(?i:FORM)\s+(?P<number>MD-\d+)\s*\]?$
    require_bold: true
    number_format: Form {number}
    depth: 1
  - name: group
    pattern: ^(?P<label>PART|Appendix|TABLE)\s+(?P<number>[IVX]+|\d+)\s*$
    require_bold: true
    number_format: '{schedule}.{label} {number} (S3-9)'
  - name: schedule
    pattern: ^(?P<number>FIRST|SECOND|THIRD|FOURTH|FIFTH|SIXTH|SEVENTH|SEVENTH|EIGHTH)\s+SCHEDULE\s*(?P<title>.*)$
    require_bold: false
    number_format: Schedule {ordinal}
    depth: 1
  - name: rule
    pattern: ^\[?(?P<number>\d+[A-Z]?(?:\.\d+)*)(?:\.\s*|\s+|$)(?P<title>.*)$
    require_bold: true
    number_format: '{number} / Schedule N.{number}'
    depth: 1
  - name: subrule
    pattern: ^\((?P<number>\d+|[a-z]+|[A-Z])\)\s*(?P<title>.*)$
    require_bold: false
    number_format: merged into parent
    depth: 2
  max_depth: 2
  body_start_marker: null
  body_stop_marker: null
  skip_sections:
  - ^(Preface|Public Comment|Additional Copies|Paperwork Reduction Act)\b
  strip_lines:
  - ^CHAPTER\s+[IVX]+\b
  - ^\*+$
  - ^Central Drugs Standard Control Organization, Ministry of Health and Family Welfare, Govt\. of India\s+Page \d+ of \d+$
  tables: 'off'
  expected_clauses:
  - 100
  - 220
